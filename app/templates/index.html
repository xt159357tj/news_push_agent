<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日 AI 新闻助手</title>
  <link rel="stylesheet" href="/static/style.css?v=20261021-2" />
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <div>
          <h1>每日 AI 新闻助手</h1>
          <p id="status-line" class="status-line">正在读取你的设置…</p>
        </div>
      </div>
      <nav class="settings-buttons" aria-label="设置">
        <button type="button" class="chip-btn" data-open="dlg-profile">登录信息</button>
        <button type="button" class="chip-btn" data-open="dlg-time">推送时间</button>
        <button type="button" class="chip-btn" data-open="dlg-sub">订阅偏好</button>
      </nav>
    </header>

    <main class="chat" aria-label="对话">
      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>

      <div class="composer">
        <div id="suggestions" class="suggestions" aria-label="示例指令"></div>
        <div class="chat-input-row">
          <textarea id="chat-input" rows="1" placeholder="和助手说点什么，例如「立即生成简报」或「查看历史简报」"></textarea>
          <button id="chat-send" type="button" class="send-btn">发送</button>
        </div>
        <p class="hint">Enter 发送，Shift+Enter 换行。生成简报、查看历史、读写文件都可以直接说。</p>
      </div>
    </main>
  </div>

  <dialog id="dlg-profile" class="panel">
    <form method="dialog" class="panel-body" onsubmit="return false;">
      <h2>登录信息</h2>
      <label>昵称 <input id="name" autocomplete="name" /></label>
      <label>邮箱 <input id="email" type="email" autocomplete="email" /></label>
      <label>时区 <input id="timezone" value="Asia/Shanghai" /></label>
      <p id="profile-message" class="message" role="status"></p>
      <div class="panel-actions">
        <button type="button" class="ghost" data-close="dlg-profile">关闭</button>
        <button type="button" id="save-profile">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-time" class="panel">
    <form method="dialog" class="panel-body" onsubmit="return false;">
      <h2>推送时间</h2>
      <div class="time-picker-heading">
        <span>滑动选择小时和分钟</span>
        <output id="delivery_time_display" for="delivery_hour delivery_minute" aria-live="polite">08:00</output>
      </div>
      <input id="delivery_time" type="hidden" value="08:00" />
      <div class="time-sliders">
        <div class="time-slider">
          <label for="delivery_hour">小时 <span id="delivery_hour_value">08</span></label>
          <input id="delivery_hour" type="range" min="0" max="23" step="1" value="8" />
          <div class="slider-bounds" aria-hidden="true"><span>00</span><span>23</span></div>
        </div>
        <div class="time-slider">
          <label for="delivery_minute">分钟 <span id="delivery_minute_value">00</span></label>
          <input id="delivery_minute" type="range" min="0" max="59" step="1" value="0" />
          <div class="slider-bounds" aria-hidden="true"><span>00</span><span>59</span></div>
        </div>
      </div>
      <p class="hint">按登录信息中的时区推送：<span id="delivery_timezone">Asia/Shanghai</span></p>
      <p id="time-message" class="message" role="status"></p>
      <div class="panel-actions">
        <button type="button" class="ghost" data-close="dlg-time">关闭</button>
        <button type="button" id="save-time">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-sub" class="panel">
    <form method="dialog" class="panel-body" onsubmit="return false;">
      <h2>订阅偏好</h2>
      <label>关注话题（逗号分隔）<input id="topics" placeholder="大模型,AI Agent,具身智能" /></label>
      <label>关键词（逗号分隔）<input id="keywords" placeholder="GPT,Claude,开源" /></label>
      <div class="two-col">
        <label>语言
          <select id="language"><option value="zh">中文</option><option value="en">English</option></select>
        </label>
        <label>条数 <input id="max_items" type="number" value="10" min="1" max="20" /></label>
      </div>
      <p id="sub-message" class="message" role="status"></p>
      <div class="panel-actions">
        <button type="button" class="ghost" data-close="dlg-sub">关闭</button>
        <button type="button" id="save-sub">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js?v=20261021-2"></script>
</body>
</html>
