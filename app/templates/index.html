<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日 AI 新闻助手</title>
  <link rel="stylesheet" href="/static/style.css?v=20261020-1" />
</head>
<body>
  <main class="container">
    <h1>每日 AI 新闻助手</h1>

    <section class="card">
      <h2>身份信息</h2>
      <div class="row">
        <label>昵称 <input id="name" /></label>
        <label>邮箱 <input id="email" type="email" /></label>
        <label>时区 <input id="timezone" value="Asia/Shanghai" /></label>
      </div>
      <button onclick="saveProfile()">保存身份</button>
    </section>

    <section class="card">
      <h2>订阅偏好</h2>
      <div class="row">
        <label>关注话题（逗号分隔）<input id="topics" placeholder="大模型,AI Agent,具身智能" /></label>
        <label>关键词（逗号分隔）<input id="keywords" placeholder="GPT,Claude,开源" /></label>
      </div>
      <div class="row">
        <label>语言
          <select id="language"><option value="zh">中文</option><option value="en">English</option></select>
        </label>
        <label>条数 <input id="max_items" type="number" value="10" min="1" max="20" /></label>
      </div>
      <fieldset class="time-picker">
        <legend>推送时间</legend>
        <div class="time-picker-heading">
          <span>滑动选择小时和分钟</span>
          <output id="delivery_time_display" for="delivery_hour delivery_minute" aria-live="polite">08:00</output>
        </div>
        <input id="delivery_time" type="hidden" value="08:00" />
        <div class="time-sliders">
          <div class="time-slider">
            <label for="delivery_hour">小时 <span id="delivery_hour_value">08</span></label>
            <input id="delivery_hour" type="range" min="0" max="23" step="1" value="8" />
            <div class="slider-bounds" aria-hidden="true"><span>00</span><span>23</span></div>
          </div>
          <div class="time-slider">
            <label for="delivery_minute">分钟 <span id="delivery_minute_value">00</span></label>
            <input id="delivery_minute" type="range" min="0" max="59" step="1" value="0" />
            <div class="slider-bounds" aria-hidden="true"><span>00</span><span>59</span></div>
          </div>
        </div>
        <p class="timezone-hint">按身份信息中的时区设置：<span id="delivery_timezone">Asia/Shanghai</span></p>
      </fieldset>
      <button onclick="saveSubscription()">保存订阅</button>
      <div id="sub-message" class="message"></div>
    </section>

    <section class="card">
      <h2>立即生成简报</h2>
      <button onclick="generate()">开始生成</button>
      <div id="job-status" class="message"></div>
    </section>

    <section class="card">
      <h2>历史简报</h2>
      <p class="timezone-hint">显示时区：<span id="history_timezone">Asia/Shanghai</span></p>
      <div id="digest-list"></div>
    </section>

    <section class="card" id="digest-detail" hidden>
      <h2 id="digest-title"></h2>
      <p id="digest-generated-at" class="timezone-hint"></p>
      <p id="digest-overview"></p>
      <div id="digest-items"></div>
    </section>
  </main>

  <script src="/static/app.js?v=20261020-1"></script>
</body>
</html>
